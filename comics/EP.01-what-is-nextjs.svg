<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg-01" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad-01" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg-01)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.01</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad-01)">认识 Next.js 16.4</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">NEXT.JS 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad-01)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：两套仓库两遍部署</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="283" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">页面在浏览器，数据在另一台服务器，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">首屏还要自己拼一套 SSR。</text>
    <rect x="24" y="152" width="524" height="90" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 传统：SPA + 独立后端</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">fetch('/api/posts')   // 至少一跳</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">首屏空白，SEO 靠补渲染</text>
    <text x="38" y="224" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">两个仓库 · 两条发布线</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">React 只给你零件，Next 给你整车。</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">路由、渲染、缓存、部署一次组装。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：一个仓库里的全栈</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">把两层收进同一个应用，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">一次部署就能贯通两端。</text>
    <rect x="32" y="152" width="132" height="26" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="98" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#22d3ee">app/ 文件</text>
    <text x="176" y="170" font-size="12.5" fill="#cbd5e1">文件即路由，page 才成为 URL</text>
    <rect x="32" y="188" width="132" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="98" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a78bfa">RSC 直出</text>
    <text x="176" y="206" font-size="12.5" fill="#cbd5e1">服务端组件查库，零客户端 JS</text>
    <rect x="32" y="224" width="132" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="98" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">Action / API</text>
    <text x="176" y="242" font-size="12.5" fill="#cbd5e1">写操作与对外能力才写端点</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">服务端产 HTML，客户端接管交互叶子；</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">鉴权落在 Action、Handler 与数据层。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：16.4 的四张新牌</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">16.4 官宣缓存组件人人可用，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">再配两个分阶段渲染开关。</text>
    <rect x="24" y="152" width="524" height="108" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// 16.4 新牌面</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">ensureStatic: 'navigation' // 静态保证</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">await navigation() // 推迟到真实导航</text>
    <text x="38" y="224" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">await prefetch()   // 排除出外壳</text>
    <text x="38" y="242" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">next upgrade --agent // 智能体升级</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">16.4 = 缓存组件全面推荐 + 静态保证。</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">17 起 Cache Components 将成为默认。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：先画边界</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">别把 Next 当纯前端框架，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">边界画错，后面全是补丁。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="13.5" fill="#e2e8f0">把密钥 / 数据库代码写进客户端组件</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="13.5" fill="#e2e8f0">升级 16 后忘记 await params、cookies</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="13.5" fill="#e2e8f0">以为全站必须 SSR 或必须静态</text>
    <rect x="24" y="288" width="524" height="38" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="38" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.3" font-weight="bold" fill="#f97316">先画清服务端与客户端边界，再谈优化。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · nextjs-tutorial · EP.01</text>
</svg>
