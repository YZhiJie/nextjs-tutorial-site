<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg-03" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad-03" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg-03)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.03</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad-03)">服务端组件与客户端组件</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">NEXT.JS 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad-03)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：整页都 use client</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="268" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">为了一个按钮，把指令打在根布局，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">结果整棵树都进了客户端包。</text>
    <rect x="24" y="152" width="524" height="90" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">'use client'   // 打在根布局</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">↓ 整棵树进入客户端包</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">密钥、数据库代码被迫搬走</text>
    <text x="38" y="224" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">首屏 JS +300KB</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">边界画大一圈，代价就是整包。</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">服务端能力被迫改成接口。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：模块图上的边界</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="253" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">判断标准只有一句话：</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">这段逻辑必须响应浏览器变化吗？</text>
    <rect x="32" y="152" width="132" height="26" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="98" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#22d3ee">服务端</text>
    <text x="176" y="170" font-size="12.5" fill="#cbd5e1">查库 / 密钥 / 大段静态内容</text>
    <rect x="32" y="188" width="132" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="98" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a78bfa">客户端</text>
    <text x="176" y="206" font-size="12.5" fill="#cbd5e1">状态 / 事件 / 浏览器 API</text>
    <rect x="32" y="224" width="132" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="98" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">children</text>
    <text x="176" y="242" font-size="12.5" fill="#cbd5e1">客户端壳可包服务端内容</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">'use client' 只写在客户端子树入口；</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">它不会感染通过 children 传入的组件。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：组合而不是下沉</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="266" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">搜索框需要状态，商品卡不需要，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">让服务端内容从 children 穿过去。</text>
    <rect x="24" y="152" width="524" height="108" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// page.tsx（服务端）</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;SearchBox&gt;</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  &lt;ProductGrid products={products} /&gt;</text>
    <text x="38" y="224" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;/SearchBox&gt;</text>
    <text x="38" y="242" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// SearchBox 是客户端，children 仍是服务端</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">把交互收成小叶子，</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">数据与渲染留在大片服务端。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：可序列化才过边界</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">跨边界传的是数据，不是函数，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">更不是数据库连接。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="13.5" fill="#e2e8f0">客户端组件也会被 SSR 成 HTML</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="13.5" fill="#e2e8f0">props 必须可序列化，函数不能直接传</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="13.5" fill="#e2e8f0">客户端文件 import 服务端组件 → 全变客户端</text>
    <rect x="24" y="288" width="524" height="38" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="38" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.3" font-weight="bold" fill="#f97316">先问“谁需要交互”，再决定边界。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · nextjs-tutorial · EP.03</text>
</svg>
