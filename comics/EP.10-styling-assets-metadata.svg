    <text x="38" y="170" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">@import 'tailwindcss'</text>
    <text x="38" y="186" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">@theme { --color-brand: #1d6ff2 }</text>
    <text x="38" y="202" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">const geist = Geist({ subsets: ['latin'] })</text>
    <text x="38" y="218" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;body className={geist.className}&gt;</text>
    <text x="38" y="234" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">export const metadata: Metadata = { title, openGraph }</text>
    <text x="38" y="250" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// sitemap.ts · robots.ts · opengraph-image.tsx</text>
    <rect x="24" y="306" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="306" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="326" font-size="13.3" fill="#e2e8f0">设计令牌、字体、SEO 都在构建期定型；</text>
    <text x="40" y="346" font-size="13.3" fill="#94a3b8">运行时只负责组合。</text>
  </g>

