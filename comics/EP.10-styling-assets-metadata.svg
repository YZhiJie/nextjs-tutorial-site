    <text x="176" y="170" font-size="12.5" fill="#cbd5e1">CSS 里 @theme 定义设计令牌</text>
    <rect x="32" y="188" width="132" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="98" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a78bfa">next/font</text>
    <text x="176" y="206" font-size="12.5" fill="#cbd5e1">构建期自托管，零布局偏移</text>
    <rect x="32" y="224" width="132" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="98" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">next/image</text>
