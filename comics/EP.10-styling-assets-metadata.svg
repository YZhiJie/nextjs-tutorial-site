    <text x="102" y="104" font-size="15" fill="#0b1220">样式、字体、图片、SEO 各自为政，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">LCP 和 CLS 一起崩。</text>
    <rect x="24" y="152" width="524" height="90" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">@tailwind base/components/utilities  // v3</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">字体手动 preload，图片直接放大图</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">&lt;img&gt; 不写尺寸 → CLS 抖动</text>
