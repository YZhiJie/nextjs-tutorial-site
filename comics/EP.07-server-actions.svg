<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg-07" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad-07" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg-07)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.07</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad-07)">Server Actions 与表单变更</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">NEXT.JS 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad-07)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：一个表单四份代码</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="262" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">提交要手写接口、校验、loading，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">还得记得刷新列表。</text>
    <rect x="24" y="152" width="524" height="90" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">onSubmit → fetch('/api/todo')</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">手写校验 / loading / 错误 / 刷新</text>
    <text x="38" y="206" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">接口 + 客户端状态 + 重新取数</text>
    <text x="38" y="224" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">一个表单四份代码</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">链路越长，遗漏越多。</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">错误与 pending 状态全靠手写。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：函数就是端点</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="253" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">函数顶部写 'use server'，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">提交、序列化、重渲染交给框架。</text>
    <rect x="32" y="152" width="132" height="26" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="98" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#22d3ee">'use server'</text>
    <text x="176" y="170" font-size="12.5" fill="#cbd5e1">函数只在服务端执行</text>
    <rect x="32" y="188" width="132" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="98" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a78bfa">&lt;form action&gt;</text>
    <text x="176" y="206" font-size="12.5" fill="#cbd5e1">无 JS 也能提交，渐进增强</text>
    <rect x="32" y="224" width="132" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="98" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">useActionState</text>
    <text x="176" y="242" font-size="12.5" fill="#cbd5e1">状态 / 包装后的 action / pending</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">底层是 POST，只有 POST 能调用；</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">客户端不能定义，只能从模块导入。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：校验、写库、失效</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">返回状态给表单，写库后让页面</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">重新取数——一个往返完成。</text>
    <rect x="24" y="152" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">'use server'</text>
    <text x="38" y="186" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">export async function createTodo(prev, formData) {</text>
    <text x="38" y="202" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  const title = String(formData.get('title'))</text>
    <text x="38" y="218" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  if (!title) return { error: '标题必填' }</text>
    <text x="38" y="234" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  await db.todo.create({ data: { title } })</text>
    <text x="38" y="250" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  revalidatePath('/todos')</text>
    <text x="38" y="266" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <rect x="24" y="306" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="306" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="326" font-size="13.3" fill="#e2e8f0">useActionState 接住返回值；</text>
    <text x="40" y="346" font-size="13.3" fill="#94a3b8">待办列表随重渲染自动更新。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：Action 是公开端点</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">能从前端调用的函数，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">就必须假设任何人都能调。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="13.5" fill="#e2e8f0">Action 是公开 POST 端点，必须自行鉴权</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="13.5" fill="#e2e8f0">参数必须可序列化，不能传函数或类实例</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="13.5" fill="#e2e8f0">乐观更新失败要回滚，不能假装成功</text>
    <rect x="24" y="288" width="524" height="38" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="38" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.3" font-weight="bold" fill="#f97316">先鉴权，再校验，最后写库。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · nextjs-tutorial · EP.07</text>
</svg>
