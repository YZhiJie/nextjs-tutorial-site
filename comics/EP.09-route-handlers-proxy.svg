<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" font-family="'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif">
  <defs>
    <linearGradient id="bg-09" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="titleGrad-09" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="840" fill="url(#bg-09)"/>
  <polygon points="980,0 1060,0 760,840 680,840" fill="#22d3ee" opacity="0.04"/>
  <polygon points="150,0 220,0 1040,840 970,840" fill="#a78bfa" opacity="0.03"/>

  <rect x="20" y="14" width="92" height="36" rx="9" fill="#7C3AED"/>
  <text x="66" y="38" text-anchor="middle" font-size="18" font-weight="bold" fill="#ffffff">EP.09</text>
  <text x="126" y="40" font-size="26" font-weight="bold" fill="url(#titleGrad-09)">Route Handlers 与 proxy.ts</text>
  <text x="1180" y="38" text-anchor="end" font-size="13" fill="#64748b">NEXT.JS 漫画剧场 · 霓虹墨 NEON INK</text>
  <rect x="20" y="62" width="1160" height="2" rx="1" fill="url(#titleGrad-09)" opacity="0.6"/>

  <g transform="translate(20,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#22d3ee" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#22d3ee"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">1</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">困境：端点与中间件分家</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#1d4ed8"/>
      <path d="M-5,18 L5,18 L3.5,27 L0,29 L-3.5,27 Z" fill="#f97316"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 L-11,-13 L-6,-4 L0,-14 L6,-4 L11,-13 L16,-2 Q0,-11 -16,-2 Z" fill="#f97316"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="281" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">旧 API 要迁进 app/，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">middleware 又跑在 Edge 连不上库。</text>
    <rect x="24" y="152" width="524" height="90" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// pages/api 迁到 app/route.ts</text>
    <text x="38" y="188" font-size="12.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">export async function GET(req) { ... }</text>
    <text x="38" y="206" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// middleware.ts 在 Edge，连不上 Node 库</text>
    <text x="38" y="224" font-size="12.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// Webhook 需要原始 body 验签</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#22d3ee"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">端点与拦截层要分清职责。</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">运行时差异会直接决定能不能用。</text>
  </g>

  <g transform="translate(608,84)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#a78bfa" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#a78bfa"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">2</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">揭秘：route 与 proxy</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="323" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">route.ts 基于标准 Request/Response；</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">proxy.ts 负责粗粒度路由拦截。</text>
    <rect x="32" y="152" width="132" height="26" rx="8" fill="#111a30" stroke="#22d3ee" stroke-opacity="0.5"/>
    <text x="98" y="170" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#22d3ee">route.ts</text>
    <text x="176" y="170" font-size="12.5" fill="#cbd5e1">GET/POST/PUT... 标准 Web API</text>
    <rect x="32" y="188" width="132" height="26" rx="8" fill="#111a30" stroke="#a78bfa" stroke-opacity="0.5"/>
    <text x="98" y="206" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#a78bfa">405</text>
    <text x="176" y="206" font-size="12.5" fill="#cbd5e1">未导出的方法自动拒绝</text>
    <rect x="32" y="224" width="132" height="26" rx="8" fill="#111a30" stroke="#f472b6" stroke-opacity="0.5"/>
    <text x="98" y="242" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#f472b6">proxy.ts</text>
    <text x="176" y="242" font-size="12.5" fill="#cbd5e1">Node 运行时，可做重写与跳转</text>
    <rect x="24" y="288" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="52" rx="2" fill="#a78bfa"/>
    <text x="40" y="308" font-size="13.3" fill="#e2e8f0">proxy 只做轻量判断；</text>
    <text x="40" y="328" font-size="13.3" fill="#94a3b8">鉴权与数据校验留在端点或 DAL。</text>
  </g>

  <g transform="translate(20,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f472b6" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f472b6"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">3</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">实证：验签与流式</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#7C3AED"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-13 -16,-13 q-13,0 -16,13 z" fill="#22d3ee"/>
      <circle cx="15" cy="4" r="6.5" fill="#22d3ee"/>
      <circle cx="-5" cy="0" r="1.7" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.7" fill="#0b1220"/>
      <path d="M-3,5 q3,3 6,0" stroke="#0b1220" stroke-width="1.3" fill="none"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="247" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">Webhook 要先拿原始文本验签，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">再解析 JSON 写库。</text>
    <rect x="24" y="152" width="524" height="130" rx="8" fill="#0a0f1c" stroke="#22d3ee" stroke-opacity="0.35"/>
    <text x="38" y="170" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">export async function POST(req: NextRequest) {</text>
    <text x="38" y="186" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  const raw = await req.text()</text>
    <text x="38" y="202" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  verifySignature(raw, req.headers)</text>
    <text x="38" y="218" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  const body = JSON.parse(raw)</text>
    <text x="38" y="234" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">  return Response.json({ ok: true }, { status: 201 })</text>
    <text x="38" y="250" font-size="11.5" fill="#7dd3fc" font-family="'SF Mono',Consolas,monospace">}</text>
    <text x="38" y="266" font-size="11.5" fill="#34d399" font-family="'SF Mono',Consolas,monospace">// proxy.ts 只做语言协商 / 租户路径粗筛</text>
    <rect x="24" y="306" width="524" height="52" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="306" width="4" height="52" rx="2" fill="#f472b6"/>
    <text x="40" y="326" font-size="13.3" fill="#e2e8f0">验签在前，解析在后；</text>
    <text x="40" y="346" font-size="13.3" fill="#94a3b8">流式响应直接用 ReadableStream。</text>
  </g>

  <g transform="translate(608,462)">
    <rect width="572" height="361" rx="14" fill="#0e1730" stroke="#223055"/>
    <polygon points="380,0 450,0 120,361 50,361" fill="#f97316" opacity="0.04"/>
    <rect x="14" y="13" width="26" height="20" rx="6" fill="#f97316"/>
    <text x="27" y="28" text-anchor="middle" font-size="14" font-weight="bold" fill="#0b1220">4</text>
    <text x="50" y="29" font-size="17" font-weight="bold" fill="#e2e8f0">结案：请求体只有一次</text>
    <g transform="translate(52,110)">
      
      <rect x="-19" y="14" width="38" height="22" rx="9" fill="#cbd5e1"/>
      <circle cx="0" cy="-2" r="16" fill="#ffd9b3"/>
      <path d="M-16,-2 a16,16 0 0 1 32,0 q-3,-12 -16,-12 q-13,0 -16,12 z" fill="#e2e8f0"/>
      <circle cx="-5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="5" cy="0" r="4" fill="none" stroke="#94a3b8" stroke-width="1.4"/>
      <path d="M-1,0 L1,0" stroke="#94a3b8" stroke-width="1.4"/>
      <circle cx="-5" cy="0" r="1.4" fill="#0b1220"/>
      <circle cx="5" cy="0" r="1.4" fill="#0b1220"/>
      <path d="M-8,5 q8,7 16,0 q-2,7 -8,7 q-6,0 -8,-7 z" fill="#e2e8f0"/>
    </g>
    <polygon points="88,100 74,106 88,112" fill="#f8fafc"/>
    <rect x="88" y="82" width="240" height="52" rx="10" fill="#f8fafc"/>
    <text x="102" y="104" font-size="15" fill="#0b1220">读过 json 再读 text 会报错，</text>
    <text x="102" y="126" font-size="15" fill="#0b1220">默认不缓存也别当成静态。</text>
    <rect x="24" y="154" width="96" height="26" rx="13" fill="#f97316"/>
    <text x="72" y="172" text-anchor="middle" font-size="13" font-weight="bold" fill="#0b1220">⚠ 坑点</text>
    <rect x="32" y="200" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="209" font-size="13.5" fill="#e2e8f0">读两次 body（json 后再 text）会报错</text>
    <rect x="32" y="228" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="237" font-size="13.5" fill="#e2e8f0">Route Handler 默认不缓存</text>
    <rect x="32" y="256" width="9" height="9" rx="2" fill="#f97316"/>
    <text x="52" y="265" font-size="13.5" fill="#e2e8f0">在 proxy 里做数据库鉴权，慢且不该</text>
    <rect x="24" y="288" width="524" height="38" rx="8" fill="#111a30" stroke="#1e2a44"/>
    <rect x="24" y="288" width="4" height="38" rx="2" fill="#f97316"/>
    <text x="40" y="308" font-size="13.3" font-weight="bold" fill="#f97316">端点管数据，proxy 管路由。</text>
  </g>

  <text x="1180" y="832" text-anchor="end" font-size="11" fill="#475569">NEON INK · nextjs-tutorial · EP.09</text>
</svg>
